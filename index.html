<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <title>Talking Head</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
      body { font-family: system-ui, sans-serif; color: #ddd; }
      #stage {
        position: fixed; inset: 0; background: #000; overflow: hidden;
        touch-action: none; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none;
      }
      #underlay {
        position: absolute; left: 50%; top: 50%; max-width: 100%; max-height: 100%; transform-origin: center;
        pointer-events: none; display: none; user-select: none;
      }
      body.edit #underlay { display: block; }
      #out { position: absolute; left: 0; top: 0; transform-origin: 0 0; display: block; }
      #overlay { position: absolute; inset: 0; pointer-events: none; display: none; }
      body.edit #overlay { display: block; pointer-events: auto; }
      body.show { cursor: none; }
      .handle {
        position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
        border: 2px solid #ffb400; background: rgba(255, 180, 0, 0.25); box-sizing: border-box; cursor: grab; display: none;
      }
      .handle.selected { background: #ffb400; }
      body.edit.stage-2 .handle { display: block; }
      #hud {
        position: absolute; left: 12px; bottom: 12px; font: 12px/1.4 ui-monospace, monospace; color: #ffb400;
        background: rgba(0,0,0,0.6); padding: 6px 8px; border-radius: 4px; white-space: pre; display: none;
      }
      body.edit #hud { display: block; }
      #log {
        position: absolute; right: 12px; bottom: 12px; width: 380px; max-height: 40vh; overflow: auto;
        font: 11px/1.35 ui-monospace, monospace; color: #bbb; background: rgba(0,0,0,0.7); padding: 6px 8px;
        border-radius: 4px; display: none; white-space: pre-wrap;
      }
      body.edit #log { display: block; }
      body.debug #log {
        display: block; left: 8px; right: 8px; bottom: 132px; width: auto; max-height: 50vh; font-size: 13px; line-height: 1.4;
        -webkit-user-select: text; user-select: text;
      }
      body.debug #hud { display: block; left: 8px; right: 8px; top: 8px; bottom: auto; font-size: 12px; white-space: pre-wrap; }
      body.debug #talk { display: block; }
      body.debug #stage { cursor: auto; }
      #debugbar { position: absolute; left: 8px; right: 8px; bottom: 8px; display: none; gap: 8px; z-index: 6; }
      body.debug #debugbar { display: flex; }
      #debugbar button {
        flex: 1; padding: 12px 8px; border-radius: 8px; border: 1px solid #888; background: #111; color: #eee;
        font: 14px system-ui, sans-serif; cursor: pointer;
      }
      body.debug #talk { bottom: 60px; }
      #log .err { color: #ff6b6b; }
      #log .agent { color: #8fe3ff; }
      #log .user { color: #c8ffb0; }
      #talk {
        position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 6;
        padding: 14px 36px; border-radius: 999px; border: 2px solid #ffb400; color: #ffb400; background: rgba(0,0,0,0.7);
        font: bold 15px system-ui, sans-serif; letter-spacing: 0.05em; cursor: pointer; display: none; user-select: none; touch-action: none;
      }
      #talk.held { background: #ffb400; color: #000; }
      body.edit #talk { display: block; }
      #start {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #000; z-index: 10; cursor: pointer;
      }
      #start button {
        font-size: 22px; padding: 18px 40px; border-radius: 999px; border: 2px solid #bff6ff; color: #bff6ff;
        background: transparent; cursor: pointer; letter-spacing: 0.05em;
      }
      #start button:hover { background: rgba(191, 246, 255, 0.1); }
      #start p { position: absolute; bottom: 24px; color: #666; font-size: 13px; }
      #panel { position: absolute; top: 8px; right: 8px; width: 256px; z-index: 20; display: none; max-height: calc(100vh - 16px); overflow: auto; }
      #panel.on { display: block; }
      #banner {
        position: absolute; left: 0; right: 0; top: 0; padding: 6px 12px; text-align: center;
        font: 13px ui-monospace, monospace; color: #000; background: #ffb400; display: none; z-index: 5; pointer-events: none;
      }
      body.control #banner { display: block; }
      body.control #hud { bottom: auto; top: 36px; }
      body.control #log { bottom: auto; top: 36px; right: auto; left: 12px; max-height: 30vh; width: 340px; margin-top: 60px; }
    </style>
  </head>
  <body class="stage-1">
    <div id="stage">
      <img id="underlay" alt="" />
      <canvas id="out"></canvas>
      <div id="overlay"></div>
      <div id="panel"></div>
      <div id="banner">REMOTE CONTROL — this is a preview; changes apply to the face window. Space = talk there, E = overlay there, T = test pattern.</div>
      <button id="talk" type="button">HOLD TO TALK</button>
      <div id="debugbar">
        <button id="dbg-run" type="button">Run checks</button>
        <button id="dbg-copy" type="button">Copy log</button>
        <button id="dbg-reconnect" type="button">Reconnect</button>
      </div>
      <div id="hud"></div>
      <div id="log"></div>
    </div>
    <div id="start">
      <button id="start-btn">Start</button>
      <p>Tap to enable audio. Hold Space, or hold a finger on the screen, to talk. E = edit mode, F = fullscreen.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
